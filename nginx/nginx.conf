# Nginx reverse proxy / load balancer for the calculator service.
#
# "calculator" is the Compose service name. With 2 replicas, Docker's embedded
# DNS (127.0.0.11) returns one IP per replica and nginx round-robins between them.

server {
    listen 80;
    server_name _;

    # Re-resolve "calculator" at most every 5s instead of once at startup, so that
    # when Jenkins redeploys (new containers, new IPs) nginx follows automatically
    # without needing a restart.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $calculator_backend http://calculator:8080;

    # Shows which replica answered - handy to demonstrate load balancing:
    #   curl -i "http://localhost:8081/api/v1/add?a=1&b=2"   (look at X-Served-By)
    add_header X-Served-By $upstream_addr always;

    # Health of the proxy itself (used by the Compose health check)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        proxy_pass $calculator_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # If one replica is down/restarting, retry the request on the other one
        proxy_next_upstream error timeout http_502 http_503;
    }
}
