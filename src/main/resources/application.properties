spring.application.name=calculator
server.port=8080

# Let in-flight requests finish when Docker/Compose stops the container
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Write 100 instead of 1E+2 for BigDecimal results
spring.jackson.generator.write-bigdecimal-as-plain=true

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
# Adds /actuator/health/liveness and /actuator/health/readiness (useful later for Kubernetes)
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# Shown at /actuator/info. APP_BUILD_NUMBER is set by the Dockerfile from the Jenkins build number,
# so you can prove which build is running during the demo.
info.app.name=@project.name@
info.app.version=@project.version@
info.app.build=${APP_BUILD_NUMBER:local}
